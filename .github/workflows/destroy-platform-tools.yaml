name: 'Workflow - Destroy Platform Tools'

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "us-east-1"
  ENVIRONMENT_STAGE: "dev"

jobs:
  destroy-platform-tools:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    environment: dev

    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.IAM_ROLE }}
          role-session-name: GitHubActionsRoleSession
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to EKS - update kubeconfig
        run: aws eks update-kubeconfig --name eks-kadze-${ENVIRONMENT_STAGE} --region $AWS_REGION

      - name: Delete Route53 DNS records pointing at the shared ALB
        # external-dns creates Alias A/AAAA records (not CNAME) for every HTTPRoute
        # host — grafana, kibana, and whatever else exists that day. Match generically
        # by ALB DNS name instead of hardcoding a single CNAME lookup for grafana.
        run: |
          set -euo pipefail
          ALB_DNS=$(kubectl get gateway team-gateway -n platform-tools -o jsonpath='{.status.addresses[0].value}' 2>/dev/null || true)

          if [ -z "$ALB_DNS" ]; then
            echo "No Gateway/ALB found, skipping Route53 cleanup"
            exit 0
          fi
          echo "ALB: $ALB_DNS"

          HOSTED_ZONE_ID=$(aws route53 list-hosted-zones-by-name \
            --dns-name shevtsov.click. \
            --query 'HostedZones[0].Id' --output text | cut -d'/' -f3)

          CHANGE_BATCH=$(aws route53 list-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --output json | \
            jq --arg alb "$ALB_DNS" '{
              Changes: [
                .ResourceRecordSets[]
                | select(
                    (.AliasTarget.DNSName // "" | contains($alb))
                    or ((.ResourceRecords // []) | map(.Value) | any(contains($alb)))
                  )
                | { Action: "DELETE", ResourceRecordSet: . }
              ]
            }')

          MATCH_COUNT=$(echo "$CHANGE_BATCH" | jq '.Changes | length')
          echo "Matched ${MATCH_COUNT} Route53 record(s):"
          echo "$CHANGE_BATCH" | jq -r '.Changes[].ResourceRecordSet | "\(.Name) \(.Type)"'

          if [ "$MATCH_COUNT" -gt 0 ]; then
            echo "$CHANGE_BATCH" > /tmp/r53_delete_batch.json
            aws route53 change-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --change-batch file:///tmp/r53_delete_batch.json
          else
            echo "No matching Route53 records to delete."
          fi

      - name: Delete shared Gateway
        # Delete Gateway first so LBC reconciles and de-provisions the ALB
        # before LBC itself is uninstalled in a later step
        run: |
          kubectl delete -f gateway/gateway.yaml --ignore-not-found
          echo "Waiting for ALB to be de-provisioned..."
          sleep 30

      - name: Uninstall EKS Monitoring (Prometheus + Grafana + Alertmanager)
        run: |
          helm uninstall eks-monitoring --namespace monitoring --ignore-not-found || true

      - name: Delete monitoring namespace
        run: kubectl delete namespace monitoring --ignore-not-found

      - name: Delete LoadBalancerConfiguration and platform-tools namespace
        run: kubectl delete namespace platform-tools --ignore-not-found

      - name: Delete GatewayClass
        run: kubectl delete -f gateway/gatewayclass.yaml --ignore-not-found

      - name: Uninstall AWS Load Balancer Controller
        run: helm uninstall aws-load-balancer-controller --namespace kube-system --ignore-not-found || true

      - name: Delete Gateway API CRDs
        run: kubectl delete -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.5.0/standard-install.yaml --ignore-not-found
