name: 'Workflow - Deploy Platform Tools'
on:
  push:
    branches:
      - feature/**
      - main
permissions:
  id-token: write
  contents: read
env:
  AWS_REGION: "us-east-1"
  ENVIRONMENT_STAGE: "dev"
jobs:
  deploy-platform-tools:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    environment: dev
    steps:
      - uses: actions/checkout@v3
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.IAM_ROLE }}
          role-session-name: GitHubActionsRoleSession
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to EKS - update kubeconfig
        run: aws eks update-kubeconfig --name temporary-eks-cluster-${ENVIRONMENT_STAGE} --region $AWS_REGION
      - name: Deploy ingress-nginx controller
        run: kubectl apply -f ingress-nginx/deploy.yaml
      - name: Deploy Karpenter
        run: |
            echo "Deploy Karpenter steps go here"
      - name: Deploy EKS Logging
        run: |
            for chart in elasticsearch fluentd kibana; do
              helm upgrade --install $chart ./eks-logging/helm-${chart} \
                --namespace logging \
                --create-namespace \
                --values ./eks-logging/helm-${chart}/values/${ENVIRONMENT_STAGE}-values.yaml \
                --wait \
                --timeout 5m
            done
      - name: Finalize Deployment
        run: |
            echo "Final deployment steps and cleanup"
