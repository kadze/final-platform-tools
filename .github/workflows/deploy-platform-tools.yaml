# This worflow is primarily for platform/devops tools that need to be deployed into K8s cluster
# or tools that don't belong to Terraform
name: 'Workflow - Deploy Platform Tools'

on:
  push:
    branches:
      - feature/**
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "us-east-1"
  ENVIRONMENT_STAGE: "dev"

jobs:
  deploy-platform-tools:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    environment: dev

    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.IAM_ROLE }}
          role-session-name: GitHubActionsRoleSession
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to EKS - update kubeconfig
        run: aws eks update-kubeconfig --name eks-kadze-${ENVIRONMENT_STAGE} --region $AWS_REGION

      # Add deployment steps for each tool below
      #- name: Deploy ingress-nginx controller
      #  run: kubectl apply -f ingress-nginx/deploy.yaml

      - name: Install Gateway API CRDs
        # v1.5.0 required — LBC v3.3.0 imports sigs.k8s.io/gateway-api v1.5.0
        run: kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.5.0/standard-install.yaml

      - name: Install AWS Load Balancer Controller
        run: |
          CLUSTER_NAME="eks-kadze-${ENVIRONMENT_STAGE}"
          VPC_ID=$(aws eks describe-cluster --name "$CLUSTER_NAME" --query 'cluster.resourcesVpcConfig.vpcId' --output text)
          helm repo add eks https://aws.github.io/eks-charts
          helm repo update
          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
            --version 3.3.0 \
            --namespace kube-system \
            --values aws-load-balancer-controller/values.yaml \
            --set clusterName="$CLUSTER_NAME" \
            --set vpcId="$VPC_ID" \
            --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"=${{ vars.ALB_CONTROLLER_IAM_ROLE_ARN }} \
            --wait

          # On helm upgrade the TLS secret is regenerated but running pods still serve
          # the old cert — webhook calls fail with x509 unknown authority until pods restart.
          kubectl rollout restart deployment aws-load-balancer-controller -n kube-system
          kubectl rollout status deployment aws-load-balancer-controller -n kube-system --timeout=2m

      - name: Create GatewayClass
        # LBC does not auto-create GatewayClass. controllerName in v3.x is gateway.k8s.aws/alb
        run: kubectl apply -f gateway/gatewayclass.yaml

      - name: Deploy LoadBalancerConfiguration
        # Must be applied before the Gateway — Gateway's parametersRef points to this CR
        run: kubectl apply -f gateway/loadbalancer-configuration.yaml

      - name: Deploy shared Gateway
        run: kubectl apply -f gateway/gateway.yaml

      # Example for a tool like Karpenter
      - name: Deploy Karpenter
        run: |
            echo "Deploy Karpenter steps go here"

      - name: Install cert-manager
        run: |
          HOSTED_ZONE_ID=$(aws route53 list-hosted-zones-by-name \
            --dns-name shevtsov.click. \
            --query 'HostedZones[0].Id' --output text | cut -d'/' -f3)

          helm repo add jetstack https://charts.jetstack.io
          helm repo update
          kubectl create namespace cert-manager --dry-run=client -o yaml | kubectl apply -f -
          helm upgrade --install cert-manager jetstack/cert-manager \
            --version v1.20.2 \
            --namespace cert-manager \
            --values cert-manager/values.yaml \
            --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"=${{ vars.CERT_MANAGER_IAM_ROLE_ARN }} \
            --wait

          export HOSTED_ZONE_ID
          envsubst < cert-manager/cluster-issuer-${ENVIRONMENT_STAGE}.yaml | kubectl apply -f -

      - name: Install external-dns
        run: |
          helm repo add external-dns https://kubernetes-sigs.github.io/external-dns/
          helm repo update
          kubectl create namespace external-dns --dry-run=client -o yaml | kubectl apply -f -
          helm upgrade --install external-dns external-dns/external-dns \
            --version 1.21.1 \
            --namespace external-dns \
            --values external-dns/values.yaml \
            --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"=${{ vars.EXTERNAL_DNS_IAM_ROLE_ARN }} \
            --wait

      - name: Mirror secrets-store-csi-driver-provider-aws to private ECR
        # ECR Public resolves to IPv4 addresses unreachable from IPv6-only nodes.
        # The GHA runner has IPv4 access, so we pull here and push to private ECR
        # where nodes can authenticate via the node role (AmazonEC2ContainerRegistryReadOnly).
        run: |
          PROVIDER_VERSION="3.1.1"
          PRIVATE_ECR="381492277294.dkr.ecr.us-east-1.amazonaws.com"
          PRIVATE_REPO="${PRIVATE_ECR}/secrets-store-csi-driver-provider-aws"

          aws ecr create-repository --repository-name secrets-store-csi-driver-provider-aws --region us-east-1 2>/dev/null || true
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin "$PRIVATE_ECR"

          docker pull public.ecr.aws/aws-secrets-manager/secrets-store-csi-driver-provider-aws:${PROVIDER_VERSION}
          docker tag public.ecr.aws/aws-secrets-manager/secrets-store-csi-driver-provider-aws:${PROVIDER_VERSION} ${PRIVATE_REPO}:${PROVIDER_VERSION}
          docker push ${PRIVATE_REPO}:${PROVIDER_VERSION}

      - name: Install Secrets Store CSI Driver and AWS Provider
        run: |
          PRIVATE_REPO="381492277294.dkr.ecr.us-east-1.amazonaws.com/secrets-store-csi-driver-provider-aws"

          helm repo add secrets-store-csi-driver https://kubernetes-sigs.github.io/secrets-store-csi-driver/charts
          helm repo add aws-secrets-manager https://aws.github.io/secrets-store-csi-driver-provider-aws
          helm repo update
          helm upgrade --install secrets-store-csi-driver secrets-store-csi-driver/secrets-store-csi-driver \
            --version 1.6.0 \
            --namespace kube-system \
            --values secrets-csi/values.yaml \
            --wait
          helm upgrade --install secrets-store-csi-driver-provider-aws aws-secrets-manager/secrets-store-csi-driver-provider-aws \
            --version 3.1.1 \
            --namespace kube-system \
            --set secrets-store-csi-driver.install=false \
            --set image.repository="${PRIVATE_REPO}" \
            --wait

      - name: Create monitoring namespace and Grafana admin secret
        # Reads credentials from SSM Parameter Store (source of truth — never committed).
        # kubectl apply --dry-run | apply pattern is idempotent: safe on every run.
        run: |
          kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -

          GRAFANA_USER=$(aws ssm get-parameter \
            --name /eks-kadze-${ENVIRONMENT_STAGE}/grafana/admin_user \
            --with-decryption --query Parameter.Value --output text)
          GRAFANA_PASSWORD=$(aws ssm get-parameter \
            --name /eks-kadze-${ENVIRONMENT_STAGE}/grafana/admin_password \
            --with-decryption --query Parameter.Value --output text)

          kubectl create secret generic grafana-admin \
            --namespace monitoring \
            --from-literal=admin_user="$GRAFANA_USER" \
            --from-literal=admin_password="$GRAFANA_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy EKS Monitoring (Prometheus + Grafana + Alertmanager)
        run: |
          helm upgrade --install eks-monitoring eks-monitoring/ \
            --namespace monitoring \
            --values eks-monitoring/values.yaml \
            --values eks-monitoring/values-${ENVIRONMENT_STAGE}.yaml \
            --set grafana.serviceAccountAnnotations."eks\.amazonaws\.com/role-arn"=${{ vars.GRAFANA_CLOUDWATCH_IAM_ROLE_ARN }} \
            --wait --timeout 5m

      # DNS for Grafana (and all other HTTPRoutes) is now managed by external-dns.
      # It watches HTTPRoute objects and upserts CNAME records in shevtsov.click automatically.

      # Example for a tool like EKS Logging
      - name: Deploy EKS Logging
        run: |
            echo "Deploy EKS Logging steps go here"

      # Repeat for each additional tool...
      # Example: Deploy External DNS
      # Example: Setup K8s User Roles

      - name: Finalize Deployment
        run: |
            echo "Final deployment steps and cleanup"

