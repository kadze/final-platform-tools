# This worflow is primarily for platform/devops tools that need to be deployed into K8s cluster
# or tools that don't belong to Terraform
name: 'Workflow - Deploy Platform Tools'

on:
  push:
    branches:
      - feature/**
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "us-east-1"
  ENVIRONMENT_STAGE: "dev"
  KARPENTER_VERSION: "1.12.1"

jobs:
  deploy-platform-tools:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    environment: dev

    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.IAM_ROLE }}
          role-session-name: GitHubActionsRoleSession
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to EKS - update kubeconfig
        run: aws eks update-kubeconfig --name ${{ vars.CLUSTER_NAME }} --region $AWS_REGION

      # Add deployment steps for each tool below
      # - name: Deploy ingress-nginx controller
      #   run: kubectl apply -f ingress-nginx/deploy.yaml

      - name: Pre-warm Karpenter controller image into ECR pull-through cache
        run: |
          # public.ecr.aws is IPv4-only with no VPC endpoint, so the no-NAT node that
          # runs the controller can't import the image itself. Import it ONCE here on
          # the runner, under the CI deploy role (the SharedGHATerraformRole, whose
          # gha_terraform policy grants ecr:*). A pull-BY-TAG against the pull-through
          # path triggers the server-side import; afterwards the cache is warm and the
          # node only READS it, so no node role needs import permissions.
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$REGISTRY"
          docker pull "${REGISTRY}/ecr-public/karpenter/controller:${KARPENTER_VERSION}"

      - name: Deploy Karpenter
        env:
          CLUSTER_NAME: ${{ vars.CLUSTER_NAME }}
          KARPENTER_CONTROLLER_ROLE_ARN: ${{ vars.KARPENTER_CONTROLLER_ROLE_ARN }}
        run: |
          # The helm CHART is pulled here on the runner (public internet) — fine.
          # The controller IMAGE runs on a no-NAT node that can't reach public.ecr.aws,
          # so point it at the private ECR pull-through path. The pre-warm step above
          # already imported it under the CI deploy role, so this is a cache-HIT read for
          # the node. digest="" pulls by tag (the cached tag).
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          PULLTHROUGH="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/ecr-public/karpenter/controller"

          helm registry logout public.ecr.aws || true
          helm upgrade --install karpenter oci://public.ecr.aws/karpenter/karpenter \
            --version "${KARPENTER_VERSION}" \
            --namespace karpenter --create-namespace \
            --set "serviceAccount.annotations.eks\.amazonaws\.com/role-arn=${KARPENTER_CONTROLLER_ROLE_ARN}" \
            --set settings.clusterName="${CLUSTER_NAME}" \
            --set settings.interruptionQueue="karpenter-${CLUSTER_NAME}" \
            --set controller.image.repository="${PULLTHROUGH}" \
            --set controller.image.tag="${KARPENTER_VERSION}" \
            --set controller.image.digest="" \
            --wait
          envsubst < karpenter/ec2nodeclass.yaml | kubectl apply -f -
          kubectl apply -f karpenter/nodepool.yaml

      # Example for a tool like EKS Logging
      - name: Deploy EKS Logging
        run: |
            echo "Deploy EKS Logging steps go here"

      # Repeat for each additional tool...
      # Example: Deploy External DNS
      # Example: Setup K8s User Roles

      - name: Finalize Deployment
        run: |
            echo "Final deployment steps and cleanup"

