# This worflow is primarily for platform/devops tools that need to be deployed into K8s cluster
# or tools that don't belong to Terraform
name: 'Workflow - Deploy Platform Tools'

on:
  push:
    branches:
      - feature/**
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "us-east-1"
  ENVIRONMENT_STAGE: "dev"

jobs:
  deploy-platform-tools:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    environment: dev

    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.IAM_ROLE }}
          role-session-name: GitHubActionsRoleSession
          aws-region: ${{ env.AWS_REGION }}

      # Login to EKS, make sure to switch to the permanent cluster created with terraform once it's up
      - name: Login to EKS - update kubeconfig
        run: aws eks update-kubeconfig --name ubuntu-dev-cluster --region $AWS_REGION

      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.14.0

      # Add deployment steps for each tool below

      # Example for a tool like Karpenter
      - name: Deploy Karpenter
        run: |
            echo "Deploy Karpenter steps go here"

      # Example for a tool like EKS Logging
      - name: Deploy EKS Logging
        run: |
            echo "Deploy EKS Logging steps go here"
      
      # EKS Monitoring — Prometheus (deploys first: registers Prometheus Operator CRDs)
      - name: Deploy Prometheus
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          helm upgrade --install monitoring eks-monitoring/prometheus \
            --namespace monitoring \
            --create-namespace \
            -f eks-monitoring/prometheus/values.yaml \
            -f eks-monitoring/prometheus/values-dev.yaml \
            --wait \
            --timeout 5m

      # EKS Monitoring — Alertmanager
      - name: Deploy Alertmanager
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          helm dependency update eks-monitoring/alertmanager
          helm upgrade --install alertmanager eks-monitoring/alertmanager \
            --namespace monitoring \
            --create-namespace \
            -f eks-monitoring/alertmanager/values.yaml \
            -f eks-monitoring/alertmanager/values-dev.yaml \
            --wait \
            --timeout 3m

      # EKS Monitoring — Grafana
      - name: Deploy Grafana
        run: |
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update
          helm upgrade --install grafana eks-monitoring/grafana \
            --namespace monitoring \
            --create-namespace \
            -f eks-monitoring/grafana/values.yaml \
            -f eks-monitoring/grafana/values-dev.yaml \
            --wait \
            --timeout 3m

      # Repeat for each additional tool...
      # Example: Deploy External DNS
      # Example: Setup K8s User Roles

      - name: Finalize Deployment
        run: |
            echo "Final deployment steps and cleanup"

