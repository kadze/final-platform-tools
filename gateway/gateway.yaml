apiVersion: v1
kind: Namespace
metadata:
  name: platform-tools
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: team-gateway
  namespace: platform-tools
  annotations:
    # Internet-facing ALB in the public dual-stack subnets built by Story 1.1
    alb.ingress.kubernetes.io/scheme: internet-facing
    # dualstack: ALB gets both IPv4 and IPv6 addresses, can reach IPv6 pods directly
    alb.ingress.kubernetes.io/ip-address-type: dualstack
    # ip target type is required to route to IPv6 pod addresses
    alb.ingress.kubernetes.io/target-type: ip
    # Auto-discover public LB-only subnets by tag set by Story 1.1
    alb.ingress.kubernetes.io/subnets: tag:kubernetes.io/role/elb=1
spec:
  gatewayClassName: alb
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      # Allow HTTPRoutes from any namespace to attach to this Gateway
      allowedRoutes:
        namespaces:
          from: All
