apiVersion: v1
kind: Namespace
metadata:
  name: platform-tools
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: team-gateway
  namespace: platform-tools
  annotations:
    # ip target type is required to route to IPv6 pod addresses
    alb.ingress.kubernetes.io/target-type: ip
spec:
  gatewayClassName: alb
  # parametersRef links this Gateway to the LoadBalancerConfiguration CR.
  # Without this, LBC ignores the CR and falls back to ResolveViaDiscovery,
  # which picks up the wrong (private/IPv6-only) subnets and fails with
  # "insufficient available IP addresses" even when public subnets have 16k+ IPs.
  infrastructure:
    parametersRef:
      group: gateway.k8s.aws
      kind: LoadBalancerConfiguration
      name: team-gateway
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      # Allow HTTPRoutes from any namespace to attach to this Gateway
      allowedRoutes:
        namespaces:
          from: All
