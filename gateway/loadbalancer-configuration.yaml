apiVersion: v1
kind: Namespace
metadata:
  name: platform-tools
---
apiVersion: gateway.k8s.aws/v1beta1
kind: LoadBalancerConfiguration
metadata:
  name: team-gateway
  namespace: platform-tools
spec:
  scheme: internet-facing
  ipAddressType: dualstack
  tags:
    team: ubuntu
    component: platform-tools
    environment: dev
  # Explicit subnet IDs — used to diagnose "Evaluated 0 subnets" from tag selector.
  # Tag selector (loadBalancerSubnetsSelector) is the intended long-term approach
  # but returns 0 results in v3.3.0 despite correct tags. Using explicit IDs per
  # WORKING-WITH-AI.md §7 debugging approach.
  loadBalancerSubnets:
    - identifier: subnet-04faf1f7b3f1bc5fb
    - identifier: subnet-08fa42cb6b9ae49e6
    - identifier: subnet-08b067221420e0877
