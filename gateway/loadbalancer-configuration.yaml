apiVersion: v1
kind: Namespace
metadata:
  name: platform-tools
---
apiVersion: gateway.k8s.aws/v1beta1
kind: LoadBalancerConfiguration
metadata:
  name: team-gateway
  namespace: platform-tools
spec:
  scheme: internet-facing
  ipAddressType: dualstack
  tags:
    team: ubuntu
    component: platform-tools
    environment: dev
  # Tag-based subnet discovery: selects all subnets tagged kubernetes.io/role/elb=1
  # (set by Story 1.1 on the 3 public /18 subnets).
  # Works because Gateway is linked to this LBC via spec.infrastructure.parametersRef —
  # without that link the controller ignores this CR entirely and falls back to
  # ResolveViaDiscovery, which picks up the wrong (private/IPv6-only) subnets.
  loadBalancerSubnetsSelector:
    kubernetes.io/role/elb:
      - "1"
