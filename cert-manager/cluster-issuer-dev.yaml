apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-dev
spec:
  acme:
    # LE staging server — no rate limits, issues untrusted test certs. Fine for dev.
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: shevtsov.ap@gmail.com
    privateKeySecretRef:
      name: letsencrypt-dev-key
    solvers:
      - dns01:
          route53:
            region: us-east-1
            hostedZoneID: ${HOSTED_ZONE_ID}
