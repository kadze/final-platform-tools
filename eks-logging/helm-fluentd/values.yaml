namespace: logging

image: 383585068161.dkr.ecr.us-east-1.amazonaws.com/fluentd-efk-25c-ubuntu
imageTag: "v1.16-s3-es"

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

elasticsearch:
  host: "elasticsearch.logging.svc.cluster.local"
  port: "9200"
  scheme: "http"
  user: "elastic"
  credentialsSecret: elasticsearch-credentials

s3:
  bucket: "383585068161-state-bucket-dev"
  region: "us-east-1"
  path: "logs/"

serviceAccount:
  name: fluentd
  iamRoleArn: ""
