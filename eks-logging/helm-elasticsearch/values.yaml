namespace: logging

image: 383585068161.dkr.ecr.us-east-1.amazonaws.com/elasticsearch
imageTag: "8.13.0-linux-amd64"

replicas: 1
storage: 10Gi
storageClassName: gp2

resources:
  requests:
    memory: "1Gi"
    cpu: "500m"
  limits:
    memory: "2Gi"
    cpu: "1000m"

javaOpts: "-Xms512m -Xmx512m"

credentialsSecret: elasticsearch-credentials
