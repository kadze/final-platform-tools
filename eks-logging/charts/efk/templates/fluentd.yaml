# =============================================================================
# Fluentd - the log collector and shipper
# DaemonSet means one Fluentd pod runs on EVERY node automatically
# It picks up logs from all containers and ships to Elasticsearch + S3
# =============================================================================
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluentd
  namespace: {{ .Values.global.namespace }}
  labels:
    app: fluentd
spec:
  selector:
    matchLabels:
      app: fluentd
  template:
    metadata:
      labels:
        app: fluentd
    spec:
      serviceAccountName: fluentd   # Needs permission to read pod logs
      tolerations:
        - key: node-role.kubernetes.io/master
          effect: NoSchedule        # Also run on master nodes if any
      containers:
        - name: fluentd
          image: {{ .Values.fluentd.image }}:{{ .Values.fluentd.imageTag }}
          env:
            - name: FLUENT_ELASTICSEARCH_HOST
              value: "elasticsearch.{{ .Values.global.namespace }}.svc.cluster.local"
            - name: FLUENT_ELASTICSEARCH_PORT
              value: "9200"
            - name: FLUENT_ELASTICSEARCH_SCHEME
              value: "http"
            - name: FLUENT_ELASTICSEARCH_USER
              value: "elastic"
            - name: FLUENT_ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-credentials
                  key: password
            - name: S3_BUCKET_NAME
              value: {{ .Values.s3.bucket }}
            - name: S3_BUCKET_REGION
              value: {{ .Values.s3.region }}
            - name: S3_PATH
              value: "logs/"
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "256Mi"
              cpu: "100m"
          volumeMounts:
            - name: varlog
              mountPath: /var/log             # Where Kubernetes writes container logs
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: fluentd-config
              mountPath: /fluentd/etc         # Our custom Fluentd config
      volumes:
        - name: varlog
          hostPath:
            path: /var/log                    # Reads directly from the node's disk
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers  # Where Docker stores container logs
        - name: fluentd-config
          configMap:
            name: fluentd-config              # Defined below
---
# =============================================================================
# Fluentd ConfigMap - the actual routing rules
# This tells Fluentd: "collect these logs, parse them, send to these destinations"
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluentd-config
  namespace: {{ .Values.global.namespace }}
data:
  fluent.conf: |
    # --- INPUT: collect all container logs from Kubernetes ---
    <source>
      @type tail
      path /var/log/containers/*.log
      pos_file /var/log/fluentd-containers.log.pos
      tag kubernetes.*
      read_from_head true
      <parse>
        @type json
        time_format %Y-%m-%dT%H:%M:%S.%NZ
      </parse>
    </source>

    # --- FILTER: add Kubernetes metadata (pod name, namespace, labels) ---
    <filter kubernetes.**>
      @type kubernetes_metadata
    </filter>

    # --- OUTPUT 1: send logs to Elasticsearch ---
    <match kubernetes.**>
      @type copy

      <store>
        @type elasticsearch
        host "#{ENV['FLUENT_ELASTICSEARCH_HOST']}"
        port "#{ENV['FLUENT_ELASTICSEARCH_PORT']}"
        scheme "#{ENV['FLUENT_ELASTICSEARCH_SCHEME']}"
        user "#{ENV['FLUENT_ELASTICSEARCH_USER']}"
        password "#{ENV['FLUENT_ELASTICSEARCH_PASSWORD']}"
        logstash_format true
        logstash_prefix kubernetes-logs
        include_tag_key true
        type_name _doc
        <buffer>
          flush_interval 5s    # Send to Elasticsearch every 5 seconds
        </buffer>
      </store>

      # --- OUTPUT 2: also send logs to S3 as backup ---
      <store>
        @type s3
        s3_bucket "#{ENV['S3_BUCKET_NAME']}"
        s3_region "#{ENV['S3_BUCKET_REGION']}"
        path "#{ENV['S3_PATH']}"
        s3_object_key_format %{path}%{time_slice}_%{index}.%{file_extension}
        time_slice_format %Y%m%d%H
        <buffer time>
          timekey 3600           # Write to S3 every 1 hour
          timekey_wait 10m
          chunk_limit_size 256m
        </buffer>
      </store>
    </match>
---
# =============================================================================
# ServiceAccount + ClusterRole - gives Fluentd permission to read pod metadata
# Without this, Fluentd can't see which pod/namespace a log came from
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluentd
  namespace: {{ .Values.global.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluentd
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "list", "watch"]   # Read-only access to pod info
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluentd
roleRef:
  kind: ClusterRole
  name: fluentd
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: ServiceAccount
    name: fluentd
    namespace: {{ .Values.global.namespace }}
