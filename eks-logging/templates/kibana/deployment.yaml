apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels:
        app: kibana
    spec:
      serviceAccountName: kibana
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsNonRoot: true
      initContainers:
        # Kibana 8.x forbids connecting as the `elastic` superuser.
        # This initContainer waits for ES to be ready, then sets the
        # kibana_system built-in user's password so Kibana's main container
        # can authenticate. Using the same secret value for both accounts
        # so no extra SSM parameter is needed.
        - name: configure-kibana-user
          image: curlimages/curl:8.7.1
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
          env:
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.elasticsearch.secretName }}
                  key: {{ .Values.elasticsearch.passwordKey }}
          command:
            - /bin/sh
            - -c
            - |
              until curl -fsu "elastic:${ELASTIC_PASSWORD}" \
                http://elasticsearch:9200/_cluster/health?local=true > /dev/null 2>&1; do
                echo "Waiting for Elasticsearch..."
                sleep 5
              done
              echo "Setting kibana_system password..."
              curl -fsSX POST http://elasticsearch:9200/_security/user/kibana_system/_password \
                -u "elastic:${ELASTIC_PASSWORD}" \
                -H 'Content-Type: application/json' \
                -d "{\"password\": \"${ELASTIC_PASSWORD}\"}"
              echo "kibana_system user configured"
      containers:
        - name: kibana
          image: {{ .Values.kibana.image }}
          ports:
            - containerPort: 5601
          env:
            - name: ELASTICSEARCH_HOSTS
              value: "http://elasticsearch:9200"
            # Must use kibana_system, not elastic — ES 8 forbids the superuser here
            - name: ELASTICSEARCH_USERNAME
              value: kibana_system
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.elasticsearch.secretName }}
                  key: {{ .Values.elasticsearch.passwordKey }}
            - name: SERVER_PUBLICBASEURL
              value: "https://{{ .Values.kibana.hostname }}"
            # Disable telemetry opt-in prompt on first launch
            - name: TELEMETRY_ENABLED
              value: "false"
          resources:
            {{- toYaml .Values.kibana.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/status
              port: 5601
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 6
