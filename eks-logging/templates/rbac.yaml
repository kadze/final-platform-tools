---
# Elasticsearch: no K8s API access needed
apiVersion: v1
kind: ServiceAccount
metadata:
  name: elasticsearch
  namespace: {{ .Values.namespace }}
---
# Kibana: no K8s API access needed
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kibana
  namespace: {{ .Values.namespace }}
---
# Fluentd: needs cluster-wide pod/namespace read for kubernetes_metadata enrichment.
# IRSA annotation (eks.amazonaws.com/role-arn) injected at deploy time via --set.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluentd
  namespace: {{ .Values.namespace }}
  annotations:
    {{- toYaml .Values.fluentd.serviceAccountAnnotations | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluentd
rules:
  - apiGroups: [""]
    resources: [pods, namespaces]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluentd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluentd
subjects:
  - kind: ServiceAccount
    name: fluentd
    namespace: {{ .Values.namespace }}
