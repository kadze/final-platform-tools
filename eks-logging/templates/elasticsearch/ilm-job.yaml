apiVersion: batch/v1
kind: Job
metadata:
  name: elasticsearch-ilm-setup
  namespace: {{ .Values.namespace }}
  annotations:
    # Run after every helm install/upgrade; clean up once the Job succeeds.
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": hook-succeeded
    "helm.sh/hook-weight": "5"
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: setup-ilm
          image: curlimages/curl:8.7.1
          env:
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.elasticsearch.secretName }}
                  key: {{ .Values.elasticsearch.passwordKey }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              ES_URL="http://elasticsearch:9200"

              # Wait until Elasticsearch is accepting authenticated requests
              echo "Waiting for Elasticsearch..."
              until curl -fsu "elastic:${ELASTIC_PASSWORD}" \
                "${ES_URL}/_cluster/health?local=true" > /dev/null 2>&1; do
                sleep 10
              done
              echo "Elasticsearch is ready"

              # Create ILM policy: delete indices older than {{ .Values.elasticsearch.retention }}
              curl -fsSX PUT "${ES_URL}/_ilm/policy/fluentd-7d-policy" \
                -u "elastic:${ELASTIC_PASSWORD}" \
                -H 'Content-Type: application/json' \
                -d '{
                  "policy": {
                    "phases": {
                      "hot": {
                        "min_age": "0ms",
                        "actions": {
                          "rollover": {
                            "max_age": "1d",
                            "max_size": "5gb"
                          }
                        }
                      },
                      "delete": {
                        "min_age": "{{ .Values.elasticsearch.retention }}",
                        "actions": { "delete": {} }
                      }
                    }
                  }
                }'
              echo "ILM policy created"

              # Create index template: apply policy + single shard (single-node) to all fluentd-* indices
              curl -fsSX PUT "${ES_URL}/_index_template/fluentd-template" \
                -u "elastic:${ELASTIC_PASSWORD}" \
                -H 'Content-Type: application/json' \
                -d '{
                  "index_patterns": ["fluentd-*"],
                  "template": {
                    "settings": {
                      "number_of_shards": 1,
                      "number_of_replicas": 0,
                      "index.lifecycle.name": "fluentd-7d-policy"
                    }
                  }
                }'
              echo "Index template created"
