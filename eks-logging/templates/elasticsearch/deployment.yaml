apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      serviceAccountName: elasticsearch
      # fsGroup gives the ES process (uid 1000) ownership of the mounted PVC
      securityContext:
        fsGroup: 1000
      initContainers:
        # ES requires vm.max_map_count >= 262144 on the host; this sysctl init
        # container sets it at pod start so ES doesn't refuse to boot.
        - name: increase-vm-max-map
          image: busybox:1.36
          command: ["sysctl", "-w", "vm.max_map_count=262144"]
          securityContext:
            privileged: true
            runAsUser: 0
      containers:
        - name: elasticsearch
          image: {{ .Values.elasticsearch.image }}
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
          ports:
            - name: http
              containerPort: 9200
            - name: transport
              containerPort: 9300
          env:
            - name: discovery.type
              value: single-node
            # Security ON so Kibana shows a real login screen (auth gate).
            # HTTP TLS is OFF — ALB already terminates external TLS.
            - name: xpack.security.enabled
              value: "true"
            - name: xpack.security.http.ssl.enabled
              value: "false"
            - name: xpack.security.transport.ssl.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: {{ .Values.elasticsearch.javaOpts | quote }}
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.elasticsearch.secretName }}
                  key: {{ .Values.elasticsearch.passwordKey }}
          resources:
            {{- toYaml .Values.elasticsearch.resources | nindent 12 }}
          # TCP probe: xpack.security enabled means HTTP always requires auth,
          # which makes httpGet probes require header handling. TCP socket is
          # simpler and confirms the port is open.
          readinessProbe:
            tcpSocket:
              port: 9200
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 9200
            initialDelaySeconds: 90
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: elasticsearch-data
