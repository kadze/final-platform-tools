# AWS Load Balancer Controller — Helm values
# Installed into kube-system via deploy-platform-tools.yaml
# IAM role ARN is injected at deploy time via --set from the GHA workflow

clusterName: ubuntu-dev-cluster #TODO-ash
region: us-east-1

# Use regional ECR instead of public.ecr.aws — nodes are IPv6-only with no NAT
image:
  repository: 602401143452.dkr.ecr.us-east-1.amazonaws.com/amazon/aws-load-balancer-controller

# vpcId is required for the controller to discover subnets
# Fill in from Story 1.1 VPC output
vpcId: vpc-0d334d8b5fab0b7c0 #TODO-ash

# Enable Gateway API support (requires Gateway API CRDs installed first)
# enableGatewayAPI is not a valid key — Gateway API is controlled via featureGates
# ALBGatewayAPI is true by default in v3.x, but we make it explicit here
controllerConfig:
  featureGates:
    ALBGatewayAPI: true

serviceAccount:
  create: true
  name: aws-load-balancer-controller
  # role-arn injected at deploy time via --set in the workflow
  annotations: {}

# IPv6-primary cluster: pods have IPv6 addresses.
# ALB uses ip target type to reach pods directly — required for IPv6 pod targets.
# IPv6 works automatically when VPC/subnets have IPv6 CIDRs and ip target type is used.
defaultTargetType: ip
