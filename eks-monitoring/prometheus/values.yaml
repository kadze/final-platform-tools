# =============================================================================
# eks-monitoring/prometheus/values.yaml
# Shared defaults for the Prometheus chart
# Owner: teammate6 (MRP25CUBUN-6)
# =============================================================================

team: ubuntu
namespace: monitoring

image:
  tag: "v2.52.0"

retention: 7d

storage:
  size: 10Gi

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi

externalLabels:
  cluster: ubuntu-dev-cluster
  team: ubuntu
  environment: dev

scrapeTargets:
  versus:
    enabled: false   # enable when teammate10 deploys to versus namespace
  proshop:
    enabled: true
