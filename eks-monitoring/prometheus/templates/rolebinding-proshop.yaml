# =============================================================================
# eks-monitoring/prometheus/templates/rolebinding-proshop.yaml
#
# RoleBinding — grants Prometheus permission to discover Services
# in the proshop namespace for scraping.
#
# Without this, Prometheus Operator cannot see Services in proshop
# even if a ServiceMonitor is configured correctly.
# =============================================================================

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-proshop
  namespace: proshop
  labels:
    team: {{ .Values.team }}
    release: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: monitoring-kube-prometheus-prometheus
    namespace: {{ .Values.namespace }}
