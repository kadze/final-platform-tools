# =============================================================================
# eks-monitoring/prometheus/templates/rolebinding-versus.yaml
#
# RoleBinding — grants Prometheus permission to discover Services
# in the versus namespace for scraping.
# =============================================================================

{{- if .Values.scrapeTargets.versus.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-versus
  namespace: versus
  labels:
    team: {{ .Values.team }}
    release: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: monitoring-kube-prometheus-prometheus
    namespace: {{ .Values.namespace }}
{{- end }}
