# =============================================================================
# eks-monitoring/prometheus/templates/servicemonitor-versus.yaml
#
# ServiceMonitor — scrapes Versus backend /metrics endpoint
# Coordinated with teammate10 (MRP25CUBUN-9)
# SLO anchor: GET /api/v1/categories/ p99 latency < 800ms (99% over 30 days)
# =============================================================================

{{- if .Values.scrapeTargets.versus.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: versus-backend
  namespace: {{ .Values.namespace }}
  labels:
    team: {{ .Values.team }}
    app: versus
    release: monitoring
spec:
  # Matches teammate10's Versus backend Service by label
  # teammate10 must add label app: versus-backend to his K8s Service
  selector:
    matchLabels:
      app: versus-backend
  # Look for the Service in the versus namespace
  namespaceSelector:
    matchNames:
      - versus
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      relabelings:
        - sourceLabels: [__meta_kubernetes_service_name]
          targetLabel: service
        - targetLabel: app
          replacement: versus

{{- end }}
