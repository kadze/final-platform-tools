# =============================================================================
# eks-monitoring/prometheus/values-staging.yaml
# Staging environment overrides (not deployed yet — defined for completeness)
# =============================================================================

kube-prometheus-stack:
  prometheus:
    prometheusSpec:
      retention: 15d
      storageSpec:
        volumeClaimTemplate:
          spec:
            resources:
              requests:
                storage: 20Gi
      externalLabels:
        cluster: temporary-eks-cluster-staging
        team: ubuntu
        environment: staging
