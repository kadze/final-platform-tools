apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
    - name: team-gateway
      namespace: platform-tools
  hostnames:
    - {{ .Values.grafana.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: grafana
          port: 3000
