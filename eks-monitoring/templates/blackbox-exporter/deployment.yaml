apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox-exporter
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blackbox-exporter
  template:
    metadata:
      labels:
        app: blackbox-exporter
    spec:
      securityContext:
        runAsUser: 65534
        runAsNonRoot: true
      containers:
        - name: blackbox-exporter
          image: {{ .Values.blackboxExporter.image }}
          args:
            - --config.file=/etc/blackbox/config.yml
          ports:
            - containerPort: 9115
          resources:
            {{- toYaml .Values.blackboxExporter.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/blackbox
      volumes:
        - name: config
          configMap:
            name: blackbox-exporter-config
