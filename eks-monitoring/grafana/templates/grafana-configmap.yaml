apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Values.namespace }}
  labels:
    app: grafana
    team: {{ .Values.team }}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus-service:9090
        access: proxy
        isDefault: false

      - name: CloudWatch
        type: cloudwatch
        access: proxy
        isDefault: true
        jsonData:
          authType: default
          defaultRegion: us-east-1

  grafana.ini: |
    [server]
    root_url = http://{{ .Values.gateway.host }}

    [auth]
    disable_login_form = false

    [log]
    level = info
