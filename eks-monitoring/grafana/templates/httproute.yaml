# =============================================================================
# eks-monitoring/grafana/templates/httproute.yaml
#
# HTTPRoute for Grafana — uses Gateway API (story 1.3).
# Attaches to the team-gateway in the platform-tools namespace.
# Replaces the ingress-nginx Ingress resource.
# Host is set per-environment in values-{env}.yaml.
# =============================================================================

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-grafana
  namespace: {{ .Values.namespace }}
  labels:
    team: {{ .Values.team }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: team-gateway
      namespace: platform-tools
  hostnames:
    - {{ .Values.gateway.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Release.Name }}-grafana
          port: 80