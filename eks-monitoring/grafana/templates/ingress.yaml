# =============================================================================
# eks-monitoring/grafana/templates/ingress.yaml
#
# Ingress resource for Grafana — uses ingress-nginx (story 1.3).
# Replaces the port-forward approach used during initial development.
# Host and annotations are set per-environment in values-{env}.yaml.
# =============================================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-grafana
  namespace: {{ .Values.namespace }}
  labels:
    team: {{ .Values.team }}
  {{- with .Values.customIngress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.customIngress.ingressClassName }}
  rules:
    - host: {{ .Values.customIngress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-grafana
                port:
                  number: 80
  {{- if .Values.customIngress.tls }}
  tls:
    {{- toYaml .Values.customIngress.tls | nindent 4 }}
  {{- end }}
