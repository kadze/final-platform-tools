# =============================================================================
# eks-monitoring/grafana/values-staging.yaml
# Staging environment overrides (not deployed yet — defined for completeness)
# =============================================================================

customIngress:
  host: "grafana.ubuntu-staging.<DOMAIN>"
  annotations:
    nginx.ingress.kubernetes.io/whitelist-source-range: "YOUR_STAGING_IP/32"
  tls:
    - secretName: grafana-ubuntu-staging-tls
      hosts:
        - grafana.ubuntu-staging.<DOMAIN>

grafana:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
