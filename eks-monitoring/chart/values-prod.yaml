# =============================================================================
# eks-monitoring/chart/values-prod.yaml
# Production environment overrides (not deployed yet — defined for completeness)
# =============================================================================

kube-prometheus-stack:

  prometheus:
    prometheusSpec:
      retention: 30d
      storageSpec:
        volumeClaimTemplate:
          spec:
            resources:
              requests:
                storage: 50Gi
      externalLabels:
        cluster: temporary-eks-cluster-prod
        team: ubuntu
        environment: prod

  grafana:
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    ingress:
      enabled: true
      ingressClassName: nginx
      annotations:
        nginx.ingress.kubernetes.io/whitelist-source-range: "YOUR_PROD_IP/32"
      hosts:
        - grafana-ubuntu-prod.312ubuntu.com
      tls:
        - secretName: grafana-ubuntu-prod-tls
          hosts:
            - grafana-ubuntu-prod.312ubuntu.com
