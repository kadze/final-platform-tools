# =============================================================================
# eks-monitoring/chart/templates/grafana/admin-secret.yaml
#
# Kubernetes Secret for Grafana admin credentials
#
# IMPORTANT: This secret is NOT committed with real values.
# The actual credentials live in AWS Secrets Manager:
#   Secret name: monitoring/grafana-admin
#   Keys: admin-user, admin-password
#
# Week-1 approach: create the K8s secret manually before deploying:
#   kubectl create secret generic grafana-admin-secret \
#     --from-literal=admin-user=admin \
#     --from-literal=admin-password=$(aws secretsmanager get-secret-value \
#       --secret-id monitoring/grafana-admin \
#       --query SecretString --output text | jq -r '.password') \
#     -n monitoring
#
# Clean path (story 1.5): Secrets Manager CSI driver injects this automatically.
# =============================================================================

# This file intentionally contains no secret values.
# The secret is created out-of-band (manually or via CSI driver).
# Grafana references it via:
#   admin.existingSecret: grafana-admin-secret (in values.yaml)
