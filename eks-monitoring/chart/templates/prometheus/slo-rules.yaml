# =============================================================================
# eks-monitoring/chart/templates/prometheus/slo-rules.yaml
#
# PrometheusRule — SLO recording rules and burn-rate alerts
# Implements the two SLOs defined in eks-monitoring/README.md
# =============================================================================

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-slo-rules
  namespace: {{ .Values.namespace }}
  labels:
    team: {{ .Values.team }}
    # This label makes Prometheus Operator pick up this rule
    release: {{ .Release.Name }}
spec:
  groups:

    # -------------------------------------------------------------------------
    # SLO 1 — Proshop order success rate
    # Target: 99.5% of POST /api/orders return 2xx over 30 days
    # Error budget: 0.5%
    # -------------------------------------------------------------------------
    - name: slo.proshop.orders
      interval: 30s
      rules:

        # Recording rule — 5m success rate (used in dashboard)
        - record: slo:proshop_order_success_rate:ratio_rate5m
          expr: |
            sum(rate(http_requests_total{app="proshop", route="/api/orders"}[5m]))
            /
            sum(rate(http_requests_total{app="proshop", route="/api/orders"}[5m]))

        # Recording rule — 30d success rate (the SLO measurement)
        - record: slo:proshop_order_success_rate:ratio_rate30d
          expr: |
            sum(rate(http_requests_total{app="proshop", route="/api/orders"}[30d]))
            /
            sum(rate(http_requests_total{app="proshop", route="/api/orders"}[30d]))

        # Recording rule — error budget remaining (1 = full budget, 0 = exhausted)
        - record: slo:proshop_order_error_budget_remaining:ratio
          expr: |
            1 - (
              (1 - slo:proshop_order_success_rate:ratio_rate30d) / 0.005
            )

        # Alert — 50% budget burned (warning)
        - alert: ProshopOrderSLOBudget50PercentBurned
          expr: slo:proshop_order_error_budget_remaining:ratio < 0.5
          for: 5m
          labels:
            severity: warning
            team: ubuntu
            slo: proshop-orders
          annotations:
            summary: "Proshop order SLO error budget 50% burned"
            description: "POST /api/orders success rate has consumed 50% of the monthly error budget. Investigate immediately."

        # Alert — 100% budget burned (critical)
        - alert: ProshopOrderSLOBudgetExhausted
          expr: slo:proshop_order_error_budget_remaining:ratio < 0
          for: 5m
          labels:
            severity: critical
            team: ubuntu
            slo: proshop-orders
          annotations:
            summary: "Proshop order SLO error budget exhausted"
            description: "POST /api/orders success rate has breached the 99.5% SLO target. Freeze non-critical deployments and open an incident."

    # -------------------------------------------------------------------------
    # SLO 2 — Versus category listing latency
    # Target: p99 of GET /api/v1/categories/ < 800ms, 99% compliance over 30 days
    # Error budget: 1%
    # -------------------------------------------------------------------------
    - name: slo.versus.categories
      interval: 30s
      rules:

        # Recording rule — p99 latency over 5m window (used in dashboard)
        - record: slo:versus_categories_p99_latency:histogram_quantile5m
          expr: |
            histogram_quantile(0.99,
              sum by (le) (
                rate(django_http_requests_latency_seconds_by_view_method_bucket{
                  app="versus",
                  view="CategoryListViewSet"
                }[5m])
              )
            )

        # Recording rule — compliance rate over 30d (proportion under 800ms)
        - record: slo:versus_categories_latency_compliance:ratio_rate30d
          expr: |
            sum(rate(django_http_requests_latency_seconds_by_view_method_bucket{
              app="versus",
              view="CategoryListViewSet",
              le="0.8"
            }[30d]))
            /
            sum(rate(django_http_requests_latency_seconds_by_view_method_bucket{
              app="versus",
              view="CategoryListViewSet",
              le="+Inf"
            }[30d]))

        # Alert — p99 exceeds 800ms for 5 minutes (warning)
        - alert: VersusCategoriesLatencySLOBreached
          expr: slo:versus_categories_p99_latency:histogram_quantile5m > 0.8
          for: 5m
          labels:
            severity: warning
            team: ubuntu
            slo: versus-categories-latency
          annotations:
            summary: "Versus category listing p99 latency above 800ms"
            description: "p99 latency for GET /api/v1/categories/ is {{`{{ $value | humanizeDuration }}`}}. SLO target is 800ms. Check Django ORM queries and MySQL performance."
