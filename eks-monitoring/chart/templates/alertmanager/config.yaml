#
# Alertmanager configuration — SHARED SEAM with story 2.3
#
# This file is owned by MRP25CUBUN-6 (teammate6) at the infrastructure level.
# Story 2.3 (alerting & on-call) should submit PRs against THIS FILE to add:
#   - Alert routing rules
#   - Slack / PagerDuty receiver configs
#   - Inhibition rules
#
# Do not deploy a separate Alertmanager — use this one.
# =============================================================================

apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: {{ .Release.Name }}-alertmanager-config
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
    team: {{ .Values.team }}
spec:
  route:
    # Placeholder receiver — story 2.3 will replace with Slack/PagerDuty
    receiver: "null"
    groupBy: ["alertname", "namespace"]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 12h

  receivers:
    - name: "null"
    # Story 2.3 adds receivers here:
    # - name: slack-alerts
    #   slackConfigs:
    #     - apiURL:
    #         name: slack-webhook-secret
    #         key: url
    #       channel: "#alerts-ubuntu"

  inhibitRules: []
  # Story 2.3 adds inhibition rules here
