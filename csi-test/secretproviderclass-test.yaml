# THROWAWAY TEST ARTIFACT — proves the AWS Secrets Manager CSI mount works
# end-to-end (file mount + K8s Secret sync for env-var consumption).
# Per-app SecretProviderClasses (weather, proshop, ...) are NOT defined here;
# they land at cutover. Do not reuse this name for real apps.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: csi-test
  namespace: platform-tools
spec:
  provider: aws
  parameters:
    # objects is a YAML string (provider-specific schema, parsed by the AWS
    # provider DaemonSet). One secret here, mounted as a file named via
    # objectAlias.
    #
    # PLACEHOLDER_TEST_SECRET: substitute the actual Secrets Manager secret
    # name (or full ARN) before applying. Do NOT use real app paths
    # (weather-ubuntu/*, proshop/*) for this test — keep test scope clean
    # and make the test pod's IRSA grant a strict subset.
    objects: |
      - objectName: "PLACEHOLDER_TEST_SECRET"
        objectType: "secretsmanager"
        objectAlias: "test-secret"
  # secretObjects is what materializes the mounted secret into a real K8s
  # Secret resource — REQUIRED for env-var consumption via envFrom/env.
  # Without this block, the secret is only available as a file under the CSI
  # mountpath. Driver-side this requires syncSecret.enabled=true on the
  # driver chart (see secrets-store-csi-driver/values.yaml).
  secretObjects:
    - secretName: csi-test-synced
      type: Opaque
      data:
        # objectName here must match an objectAlias (or objectName) above.
        - objectName: "test-secret"
          key: TEST_SECRET
